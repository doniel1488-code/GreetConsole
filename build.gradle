plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

def consoleSourceGzip = file('src/main/java/ru/governix/greetconsole/ConsoleWindow.java.gz')
def consoleSourceJava = file('src/main/java/ru/governix/greetconsole/ConsoleWindow.java')

tasks.register('restoreConsoleWindowSource') {
    inputs.file consoleSourceGzip
    outputs.file consoleSourceJava
    doLast {
        if (!consoleSourceGzip.isFile()) {
            throw new GradleException("Missing compressed ConsoleWindow.java source: ${consoleSourceGzip}")
        }
        consoleSourceJava.parentFile.mkdirs()
        new java.util.zip.GZIPInputStream(new java.io.FileInputStream(consoleSourceGzip)).withCloseable { input ->
            consoleSourceJava.withOutputStream { output -> input.transferTo(output) }
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('restoreConsoleWindowSource')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
