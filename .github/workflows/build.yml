name: Build GreetConsole

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft 1.21.8 mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Inspect desktop window implementation
        shell: bash
        run: |
          gzip -dc src/main/java/ru/governix/greetconsole/ConsoleWindow.java.gz > /tmp/ConsoleWindow.java
          sed -n '1,320p' /tmp/ConsoleWindow.java

      - name: Build and remap mod
        run: gradle --no-daemon clean build

      - name: Upload remapped JAR
        uses: actions/upload-artifact@v7
        with:
          name: GreetConsole-Minecraft-1.21.8
          path: build/libs/greetconsole-*.jar
          if-no-files-found: error
          retention-days: 30
