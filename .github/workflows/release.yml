name: Publish GreetConsole Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Publish self-contained C# desktop window
        shell: pwsh
        run: |
          dotnet publish companion/GreetConsole/GreetConsole.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output companion/publish
          if (!(Test-Path companion/publish/GreetConsole.exe)) { throw "C# desktop companion executable was not produced." }
          Copy-Item companion/publish/GreetConsole.exe src/main/resources/assets/greetconsole/GreetConsole.exe -Force

      - name: Build and remap Fabric mod
        run: gradle --no-daemon clean build

      - name: Package Yandex Browser extension
        shell: pwsh
        run: |
          Compress-Archive -Path browser-extension/* -DestinationPath build/GreetConsole-Yandex-Extension-1.0.0.zip -Force

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content gradle.properties | Where-Object { $_ -match '^mod_version=' }) -replace '^mod_version=', ''
          if ([string]::IsNullOrWhiteSpace($version)) { throw "mod_version was not found." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: GreetConsole ${{ steps.version.outputs.version }}
          body: |
            ## GreetConsole ${{ steps.version.outputs.version }}

            Fabric-мод для Minecraft 1.21.8. Окно журнала полностью вынесено в отдельное приложение Windows на C# / WinForms — оно не зависит от AWT и графического окружения Java.

            - **F8** — запустить или закрыть отдельное окно Windows.
            - Расширение для Яндекс Браузера показывает `logs/latest.log` в реальном времени и имеет собственную командную строку.
            - Для браузерной панели требуется запущенный Minecraft с GreetConsole 1.3.0; локальный мост слушает только `127.0.0.1:38761`.
            - Окно C# самостоятельно читает `logs/latest.log` в реальном времени.
            - Самостоятельная установка .NET не требуется: приложение C# встроено в JAR и публикуется как self-contained Windows x64.
            - Обновлённый интерфейс с отдельной командной строкой для отправки команд от имени игрока через активный Minecraft-клиент. Серверные права не обходятся.
            - Поиск, фильтры TRACE / DEBUG / INFO / WARN / ERROR / FATAL, пауза, очистка, копирование и автопрокрутка.
            - Командная строка отправляет команды через активный клиент Minecraft; серверные права не обходятся.
            - [Инструкция по установке расширения в Яндекс Браузер](https://browser.yandex.ru/help/ru/personalization/extension).
            - Unicode, кириллица, Minecraft-коды `&` / `§`, HEX `&#RRGGBB`, расширенный HEX и ANSI RGB / 256 цветов.

            Установка: замени старый JAR в папке `mods` этим файлом. Требуются Minecraft Java Edition 1.21.8, Java 21, Fabric Loader и Fabric API.

            - [Установщик Fabric Loader](https://fabricmc.net/use/installer/)
            - [Fabric API 0.136.1+1.21.8](https://modrinth.com/mod/fabric-api/versions?g=1.21.8&l=fabric)
            - [Java 21 (Eclipse Temurin)](https://adoptium.net/temurin/releases/?version=21)
            - [Инструкция по установке модов Fabric](https://docs.fabricmc.net/players/installing-mods)

            Исходный код: https://github.com/doniel1488-code/GreetConsole
          files: |
            build/libs/greetconsole-*.jar
            build/GreetConsole-Yandex-Extension-1.0.0.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
