name: Publish GreetConsole Browser Extension

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Publish self-contained C# desktop window
        shell: pwsh
        run: |
          dotnet publish companion/GreetConsole/GreetConsole.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output companion/publish
          if (!(Test-Path companion/publish/GreetConsole.exe)) { throw "C# desktop companion executable was not produced." }
          Copy-Item companion/publish/GreetConsole.exe src/main/resources/assets/greetconsole/GreetConsole.exe -Force

      - name: Build and remap Fabric mod
        run: gradle --no-daemon clean build

      - name: Package Yandex Browser extension
        shell: pwsh
        run: |
          Compress-Archive -Path browser-extension/* -DestinationPath build/GreetConsole-Yandex-Extension-1.0.4.zip -Force

      - name: Read extension version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content browser-extension/manifest.json -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($manifest.version)) { throw "Extension version was not found." }
          "version=$($manifest.version)" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extension-v${{ steps.version.outputs.version }}
          name: GreetConsole Browser Extension ${{ steps.version.outputs.version }}
          body: |
            ## GreetConsole Browser Extension ${{ steps.version.outputs.version }}

            Обновление браузерного расширения для Яндекс Браузера и совместимых Chromium-браузеров.

            - Отдельная вкладка «Вкусно — и точка»: симулятор ресторана с заказами, приготовлением, складом, экономикой и улучшениями.
            - Прогресс игры сохраняется локально; таймеры готовки ставятся на паузу при закрытии окна.
            - Вкладка консоли по-прежнему показывает журнал Minecraft и содержит строку игрового чата и команд.
            - Для связи с Minecraft требуется Fabric-мод GreetConsole 1.3.4 или новее. Симулятор работает без запущенной игры.

            Установка: скачай ZIP, распакуй его, открой `browser://extensions`, включи режим разработчика и загрузи распакованную папку. После обновления нажми «Перезагрузить» на карточке GreetConsole.
          files: |
            build/GreetConsole-Yandex-Extension-1.0.4.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
